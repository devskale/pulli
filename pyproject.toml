[project]
name = "pulli"
dynamic = ["version"]
description = "Walk a directory tree, show git repos with status, and fast-forward the ones that are behind upstream."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Waldherr" }]
keywords = ["git", "cli", "pull", "status", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
pulli = "pulli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pulli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pulli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
