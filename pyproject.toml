[project]
name = "pulli"
version = "0.1.1"
description = "Walk a directory tree, show git repos with status, and fast-forward the ones that are behind upstream."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pulli = "pulli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
